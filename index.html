<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index · Routing to Dashboard</title>
  <style>
    /* minimal, clean styling to keep the page presentable */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #f7f9fc 0%, #e9eef4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 2.5rem;
      padding: 3rem 2.5rem;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 30px 50px -20px rgba(0, 20, 40, 0.25),
                  inset 0 0 0 1px rgba(255, 255, 255, 0.7);
      text-align: center;
      transition: all 0.2s ease;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0b2a3e;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .badge {
      display: inline-block;
      background: #1e5f7a;
      color: white;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.25rem 1rem;
      border-radius: 40px;
      letter-spacing: 0.02em;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 10px rgba(0, 70, 120, 0.2);
    }

    p {
      color: #2a4052;
      font-size: 1.1rem;
      line-height: 1.6;
      margin: 1rem 0 1.8rem 0;
      padding: 0 0.5rem;
    }

    .highlight {
      font-weight: 600;
      color: #0a4b64;
      background: rgba(28, 110, 150, 0.08);
      padding: 0.2rem 0.5rem;
      border-radius: 8px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 1rem;
    }

    /* redirect progress bar – shows the routing is intentional */
    .redirect-progress {
      width: 100%;
      height: 6px;
      background: rgba(0, 50, 80, 0.1);
      border-radius: 99px;
      overflow: hidden;
      margin: 1.6rem 0 1.2rem;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }

    .redirect-progress-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #2a7f9e, #1e5f7a);
      border-radius: 99px;
      animation: loadBar 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      transform-origin: left;
      box-shadow: 0 0 8px rgba(40, 140, 190, 0.6);
    }

    @keyframes loadBar {
      0% { width: 0%; }
      35% { width: 65%; }
      100% { width: 100%; }
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #ffffff;
      border: 1px solid rgba(20, 80, 120, 0.25);
      color: #18526b;
      font-weight: 500;
      padding: 0.8rem 1.8rem;
      border-radius: 60px;
      text-decoration: none;
      font-size: 1rem;
      transition: all 0.15s ease;
      box-shadow: 0 4px 10px rgba(0, 30, 50, 0.05);
      cursor: pointer;
    }

    .btn-primary {
      background: #1e5f7a;
      border: 1px solid #1e5f7a;
      color: white;
      box-shadow: 0 12px 18px -8px rgba(20, 80, 120, 0.4);
    }

    .btn-primary:hover {
      background: #124a60;
      border-color: #124a60;
      transform: scale(1.02);
      box-shadow: 0 16px 22px -8px rgba(15, 70, 110, 0.5);
    }

    .btn:hover {
      background: #f0f6fc;
      border-color: #1e5f7a;
    }

    .btn-primary:hover {
      background: #124a60;
      color: white;
    }

    .footnote {
      font-size: 0.85rem;
      color: #5c6f7e;
      margin-top: 1.5rem;
      border-top: 1px solid rgba(30, 95, 122, 0.1);
      padding-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .route-path {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: #e3eef5;
      padding: 0.25rem 0.8rem;
      border-radius: 40px;
      font-size: 0.85rem;
      color: #0b3e54;
      display: inline-block;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Hide the fallback link section if JS is active – we use JS for instant redirect */
    .no-js-fallback {
      display: block;
    }
    .js-active .no-js-fallback {
      display: none;
    }
  </style>
</head>
<body>
  <div class="card" id="indexCard">
    <h1>
      <span>📬</span> index
    </h1>
    <div class="badge">routing · redirect</div>

    <p>
      You are being automatically routed to 
      <span class="highlight">dashboard.html</span>
    </p>

    <!-- visual feedback that redirect is in progress -->
    <div class="redirect-progress" aria-hidden="true">
      <div class="redirect-progress-fill"></div>
    </div>

    <div class="actions">
      <!-- Primary action: immediate redirect (for users who click manually) -->
      <a href="dashboard.html" class="btn btn-primary" id="directDashboardBtn">
        ⚡ Go to dashboard
      </a>
      <!-- Secondary action: cancel / stay (for demonstration) -->
      <button class="btn" id="stayBtn" type="button">
        ⏸️ Stay here
      </button>
    </div>

    <!-- This fallback appears only if JavaScript is disabled or redirect fails -->
    <div class="footnote no-js-fallback" id="fallbackNotice">
      <span>🔁 If you are not redirected,</span>
      <a href="dashboard.html" style="color: #1e5f7a; font-weight: 600; text-decoration: none;">click here to go to dashboard</a>
      <span class="route-path" style="margin-top: 6px;">target: /dashboard.html</span>
    </div>

    <!-- dynamic status message, updated by JS -->
    <div id="statusMessage" style="font-size: 0.9rem; margin-top: 0.8rem; color: #1e5f7a; min-height: 1.4rem;"></div>
  </div>

  <script>
    (function() {
      'use strict';

      // Mark that JavaScript is active (hides the static fallback notice)
      document.body.classList.add('js-active');

      // ----- routing configuration -----
      const DASHBOARD_PATH = 'dashboard.html';   // relative path, works on any host
      const REDIRECT_DELAY_MS = 2200;            // short delay to show the progress animation

      // DOM elements
      const directDashboardBtn = document.getElementById('directDashboardBtn');
      const stayBtn = document.getElementById('stayBtn');
      const statusMessage = document.getElementById('statusMessage');
      const fallbackNotice = document.getElementById('fallbackNotice');

      // we keep track of the timer so we can cancel it if the user clicks "stay"
      let redirectTimer = null;
      let isCancelled = false;

      // function to perform the redirect
      function goToDashboard() {
        if (isCancelled) return;                // user chose to stay, do not redirect
        window.location.href = DASHBOARD_PATH;
      }

      // schedule the automatic redirect (after the progress bar animation)
      function scheduleRedirect() {
        // show friendly status
        statusMessage.textContent = '⏳ Redirecting in a moment…';

        // clear any previous timer (safety)
        if (redirectTimer) {
          clearTimeout(redirectTimer);
        }

        redirectTimer = setTimeout(() => {
          if (!isCancelled) {
            goToDashboard();
          } else {
            statusMessage.textContent = '⏸️ Redirect cancelled — you can stay or click the button.';
          }
        }, REDIRECT_DELAY_MS);
      }

      // cancel redirect if user clicks "stay" – also change UI
      function cancelRedirect() {
        isCancelled = true;
        if (redirectTimer) {
          clearTimeout(redirectTimer);
          redirectTimer = null;
        }
        statusMessage.textContent = '⏸️ Auto‑redirect paused. Click "Go to dashboard" when ready.';
        // Optionally change the progress bar visual (we keep it full, but it's fine)
        // You could also hide the progress fill, but not necessary.
        // For better UX, we change the stay button text.
        stayBtn.textContent = '✅ Staying (redirect off)';
        stayBtn.disabled = true;
        stayBtn.style.opacity = '0.7';
        stayBtn.style.cursor = 'default';

        // also make the fallback notice visible again? it's hidden by .js-active, but we can show a hint.
        // Instead, we can show a special message inside status.
        // Already done via statusMessage.
      }

      // ----- attach event listeners -----
      // primary button: immediate redirect (and cancel any scheduled redirect)
      directDashboardBtn.addEventListener('click', (e) => {
        e.preventDefault();        // we want to redirect manually (to also set isCancelled = false)
        isCancelled = false;       // ensure we allow redirect
        // clear timer to avoid double redirect
        if (redirectTimer) {
          clearTimeout(redirectTimer);
          redirectTimer = null;
        }
        // update UI then redirect
        statusMessage.textContent = '🔵 Redirecting to dashboard…';
        window.location.href = DASHBOARD_PATH;
      });

      // stay button: cancel the automatic redirect
      stayBtn.addEventListener('click', cancelRedirect);

      // start the automatic redirect countdown on page load
      // small delay to ensure the progress bar animation is visible and DOM ready
      window.addEventListener('load', () => {
        // start the redirect timer (progress bar already animating via CSS)
        scheduleRedirect();
      });

      // if the page is restored from bfcache (back button), we might want to reset.
      window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
          // reset state if needed, but usually fine to leave as is.
          // optionally re-enable stay button and restart redirect? 
          // For clarity, we'll just keep the current state (cancelled or not)
          // But to avoid stale state, we can refresh the status.
          if (isCancelled) {
            statusMessage.textContent = '⏸️ Auto‑redirect paused. Click "Go to dashboard" when ready.';
          } else {
            // if it was not cancelled, we likely already redirected.
          }
        }
      });

      // Extra safety: if user navigates away and comes back, no duplicate timers
      window.addEventListener('beforeunload', () => {
        if (redirectTimer) {
          clearTimeout(redirectTimer);
          redirectTimer = null;
        }
      });

      // (Optional) Show a small confirmation in console — helpful for developers
      console.log('🚦 Index routing active · redirecting to', DASHBOARD_PATH, 'in', REDIRECT_DELAY_MS, 'ms');
    })();
  </script>
</body>
</html>
